[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "storyblocks"
version = "0.1.0"
description = "Build block-based communication products and export static pages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=3", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
storyblocks = "storyblocks.cli:main"

[tool.setuptools]
package-dir = {storyblocks = "src"}
packages = [
    "storyblocks",
    "storyblocks.blocks",
    "storyblocks.blocks.catalog",
    "storyblocks.blocks.validators",
    "storyblocks.authoring",
    "storyblocks.export",
    "storyblocks.web",
]
include-package-data = true

[tool.setuptools.package-data]
storyblocks = ["web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["venv", "build", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "C4", "SIM", "RUF", "A", "PTH"]
ignore = ["E501"]  # long prose/data strings; the formatter handles code

[tool.ruff.lint.isort]
known-first-party = ["storyblocks"]

[tool.mypy]
ignore_missing_imports = true
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
