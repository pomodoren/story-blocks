meta:
  id: format-showcase
  title: Every story format, on one page
  theme: midnight
  label: Every story format
  collection: Reference
blocks:
- type: cover
  config:
    image: /story-assets/stories/format-showcase/assets/Narta-Zvernec.webp
    image_credit: Photo reused from the slider story · Who Owns the Albanian Coast
    text: 'A good story switches format as the argument changes: a sentence, a photo, a number, a table,
      a map. This page shows each one. **All figures here are illustrative** — it demonstrates the formats,
      not a dataset.'
    title: Every story format, on one page
    eyebrow: Reference · block catalog
- type: text
  config:
    variant: lede
    body: A story is a sequence of **formats**, each chosen for what it does best. Prose carries the argument;
      a figure makes one number unforgettable; a map shows where; a table lets the reader check.
    title: Start with the argument
    eyebrow: Text
- type: text
  config:
    body: |-
      The default text block is a reading column with a short measure and a larger first paragraph, so the opening sentence does the work of a standfirst.

      Later paragraphs settle into body size. Use **bold** for the one thing a skimming reader must keep, and a link for the source.
    title: Text, set for reading
    eyebrow: Text
- type: interlude
  config:
    text: 'A single line between blocks is an interlude: a breath, not a chapter.'
- type: quote
  config:
    text: A number is an argument only once someone can see what it is a number *of*.
    cite: A reviewer's rule
    source: Story style guide · illustrative
- type: callout
  config:
    tone: method
    title: How to read this page
    text: Every block below is authored as YAML or Markdown in the spine. Nothing is fetched when the
      page opens, so the same page publishes as a static site.
- type: kpi
  config:
    figures:
    - value: 1,240
      label: Sample buildings
      text: Figure shown large, counted up once on entry.
    - value: '62'
      unit: '%'
      label: Residential
      text: A share reads best with its unit beside it.
    - value: '3.1'
      unit: M
      label: Illustrative loss
      text: Keep the label short and the note shorter.
    title: One number, then several
    eyebrow: Figures
- type: chart
  config:
    kind: bar
    labels:
    - Before 1960
    - 1960–79
    - 1980–99
    - 2000+
    series:
    - name: Sample buildings
      data:
      - 120
      - 340
      - 510
      - 270
    unit: buildings
    source: Illustrative data.
    variant: Sample buildings
    variants:
    - label: Residential share
      unit: '%'
      series:
      - name: Residential share
        data:
        - 88
        - 74
        - 61
        - 55
    text: A chart sits beside **one** sentence saying what to see in it. Bars, horizontal bars, lines
      and doughnuts are all authored inline, with no data file. Give it `variants` and chips swap the
      data.
    title: A chart, with the sentence that explains it
    eyebrow: Chart
- type: network
  config:
    layout: cose
    colors:
      Agency: '#37b6c9'
      Contractor: '#f2b53c'
    source: Illustrative data.
    nodes:
    - id: ministry
      label: Ministry
      group: Agency
      note: Awards the contracts
    - id: roads
      label: Roads authority
      group: Agency
    - id: acme
      label: Acme Build
      group: Contractor
    - id: bolt
      label: Bolt Works
      group: Contractor
    - id: city
      label: City hall
      group: Agency
      size: 30
    edges:
    - source: ministry
      target: roads
      label: oversees
    - source: roads
      target: acme
      label: contract
      weight: 6
    - source: roads
      target: bolt
      label: contract
      weight: 3
    - source: city
      target: acme
      label: contract
      weight: 4
    - source: city
      target: ministry
      label: reports to
    text: A network is authored as `nodes` and `edges`. **Click** a node to light up what it touches,
      type to find one, and switch the layout. Without JavaScript it prints as a plain list of connections.
    title: A network, when the links are the story
    eyebrow: Network
- type: ranking
  config:
    unit: buildings
    top: 4
    source: Illustrative data.
    text: A ranked list with inline bars -- plain HTML, so it prints and reads without JavaScript. With
      `metrics`, chips switch what is ranked.
    metrics:
    - label: Buildings
      rows:
      - name: Old town
        value: 420
        note: walled centre
      - name: Riverside
        value: 310
      - name: Harbour
        value: 275
      - name: Hillside
        value: 190
      - name: Market
        value: 165
    - label: Residential share
      unit: '%'
      rows:
      - name: Hillside
        value: 83
      - name: Old town
        value: 71
      - name: Riverside
        value: 58
      - name: Harbour
        value: 44
      - name: Market
        value: 36
    title: A ranking, when order is the point
    eyebrow: Ranking
- type: table
  config:
    intro: Columns sort on click, and a search box appears once there are enough rows to need one.
    caption: Illustrative data.
    columns:
    - District
    - label: Buildings
      num: true
    - label: Share residential
      num: true
    rows:
    - - Old town
      - 420
      - 71%
    - - Riverside
      - 310
      - 58%
    - - Harbour
      - 275
      - 44%
    - - Hillside
      - 190
      - 83%
    - - Market
      - 165
      - 36%
    - - Station
      - 140
      - 52%
    - - Campus
      - 95
      - 61%
    - - Industrial
      - 60
      - 12%
    title: A table, for the reader who wants to check
    eyebrow: Table
- type: gallery
  config:
    mode: mosaic
    columns: 3
    intro: Click any photo to open it large, with its caption, and use the arrow keys to move through
      the set.
    title: Photos, together
    eyebrow: Gallery
    images:
    - title: Narta and Zvërnec
      src: /story-assets/stories/format-showcase/assets/Narta-Zvernec.webp
      credit: Who Owns the Albanian Coast
      alt: Aerial view of the Narta lagoon, outlined in blue, ringed by pine forest with land-parcel boundaries
        marked in orange
      text: The lagoon, pine forest and dunes read as one coastal system.
    - title: Blue Borgo
      src: /story-assets/stories/format-showcase/assets/Blue-Borgo.webp
      alt: Aerial view of a gridded plot layout cleared in the dunes beside the sea, with parcel lines
        traced in gold
      text: A proposed resort on land with unresolved ownership claims.
    - title: Sushica
      src: /story-assets/stories/format-showcase/assets/Sushica.webp
      alt: 'The Sushica river valley: a braided stony riverbed outlined in blue below a road embankment
        and forested slopes'
      text: The river corridor inland of the coast.
    - title: Vlorë airport
      src: /story-assets/stories/format-showcase/assets/Aeropuerto-de-Vlora.webp
      wide: 'true'
      alt: Aerial view of a long new airport runway on flat land, with the surrounding plots outlined
      text: A wide frame for a wide subject.
    - title: Vlorë port
      src: /story-assets/stories/format-showcase/assets/Puerto-de-Vlora.webp
      alt: Aerial view of Vlorë port crowded with boats and ships, with property lines traced in gold
        and red
      text: The port from above.
- type: image-card
  config:
    src: /story-assets/stories/format-showcase/assets/Puerto-de-Vlora.webp
    alt: Aerial view of Vlorë port crowded with boats and ships, with property lines traced in gold and
      red
    caption: Vlorë port, with parcel boundaries traced.
    align: media-left
    explanation: A single figure beside the text that explains it -- use it for a frozen snapshot or a
      diagram, `align` flips the side.
    title: One figure, explained
    eyebrow: Image card
- type: map
  config:
    layers:
    - label: Mapped boundaries
      geojson: /story-assets/stories/format-showcase/assets/flamingo-coast-osm.geojson
      color: '#37b6c9'
    - label: Esri topographic (hosted tiles)
      kind: arcgis-tiles
      url: https://services.arcgisonline.com/arcgis/rest/services/World_Topo_Map/MapServer
      opacity: 0.7
      visible: false
    - label: Country outlines (vector tiles)
      kind: vector
      tiles:
      - https://demotiles.maplibre.org/tiles/{z}/{x}/{y}.pbf
      source_layer: countries
      color: '#9b5de5'
      opacity: 0.35
      visible: false
    markers:
    - title: Narta lagoon
      text: An example marker; click for its card.
      center:
      - 19.4237892
      - 40.5316622
    legend:
    - label: Example marker
      color: '#e01e26'
    source: 'Mapped boundaries: [OpenStreetMap](https://www.openstreetmap.org/copyright) contributors;
      hosted topographic layer: Esri; country-outline vector tiles: [MapLibre demo tiles](https://demotiles.maplibre.org).'
    text: Use a plain map when the reader only needs to see *where*. A link can move the map too -- fly
      to [the Narta lagoon](map:19.4237892,40.5316622,13) or back out to [the whole coast](map:19.45,40.45,9).
      For a map that flies from place to place as the story scrolls, use a guided tour.
    title: A map, without the scrolling
    eyebrow: Map
- type: map
  config:
    title: Cities, sized and grouped
    grayscale: true
    center:
    - 14
    - 46
    zoom: 3.4
    groups:
    - label: Western Balkans
      color: '#744761'
    - label: Central Europe
      color: '#2f6f8f'
    - label: Nordics
      color: '#b98545'
    markers:
    - title: Tirana
      text: 120 members
      center:
      - 19.82
      - 41.33
      group: Western Balkans
      value: 120
    - title: Prishtina
      text: 40 members
      center:
      - 21.16
      - 42.67
      group: Western Balkans
      value: 40
    - title: Munich
      text: 25 members
      center:
      - 11.58
      - 48.14
      group: Central Europe
      value: 25
    - title: Zurich
      text: 18 members
      center:
      - 8.54
      - 47.37
      group: Central Europe
      value: 18
    - title: Stockholm
      text: 9 members
      center:
      - 18.07
      - 59.33
      group: Nordics
      value: 9
    source: Illustrative member counts, not real data.
    text: 'Marker `value` sizes each disc, `groups` colours them and adds toggle chips, `grayscale` mutes
      the basemap -- the flamingo website map. Best with `theme: flamingo`.'
    eyebrow: Map
- type: divider
  config:
    style: dots
- type: map
  config:
    geojson:
    - /story-assets/stories/format-showcase/assets/showcase-districts.geojson
    basemap: offline
    color_by:
    - property: buildings
      label: Buildings
      unit: buildings
      classes: 4
    - property: share_res
      label: Residential share
      unit: '%'
      breaks:
      - 50
      - 75
      ramp: warm
    - property: setting
      label: Setting
      categories:
        urban: '#2a7de1'
        coastal: '#0c8599'
        rural: '#2f9e44'
    source: Illustrative district figures.
    text: '`color_by` colours the features of any GeoJSON by a property -- quantile classes, fixed `breaks`
      or categories -- with a legend and a hover card. `basemap: offline` draws the bundled world borders
      instead of fetching tiles, so this block needs no network. A list adds a chip per metric. `filter:
      "buildings >= 250"` would draw only the matching districts.'
    title: A choropleth, from any GeoJSON
    eyebrow: Map
- type: swipe
  config:
    mode: divider
    title: A picture, wiped against a map
    labels:
    - Photo
    - Mapped today
    before:
      src: /story-assets/stories/format-showcase/assets/Puerto-de-Vlora.webp
      alt: Aerial view of Vlorë port crowded with boats and ships, with property lines traced in gold
        and red
    after:
      geojson:
      - /story-assets/stories/format-showcase/assets/showcase-districts.geojson
      basemap: offline
      color_by:
        property: buildings
        label: Buildings
        unit: buildings
        classes: 4
    text: 'Drag to wipe between the two sides. `before`/`after` each take a picture (`src`, `alt`, `decorative`)
      or an authored map -- the same shape as the `map` block (`geojson`, `markers`, `layers`, `color_by`,
      `size_by`, `heatmap`, 3D) -- so a side can be either, or both sides can be maps. `mode: data-lon`
      instead wipes between two scenario loss layers, live.'
    eyebrow: Swipe
    icon: swipe
- type: guided-tour
  config:
    legend: true
    basemap: offline
    geojson:
    - /story-assets/stories/format-showcase/assets/showcase-heritage.geojson
    - /story-assets/stories/format-showcase/assets/showcase-exposure.geojson
    layers:
    - label: 1-in-100 flood extent
      geojson: /story-assets/stories/format-showcase/assets/showcase-flood.geojson
      color: '#2a7de1'
      opacity: 0.25
      visible: false
    color_by:
    - property: designation
      label: Designation
      categories:
        Ramsar wetland: '#0c8599'
        Nature reserve: '#2f9e44'
        Protected landscape: '#b98545'
    - property: pressure
      label: Pressure index
      unit: /100
      breaks:
      - 30
      - 50
      - 65
      ramp: warm
    size_by:
      property: value_m
      label: Exposed value
      unit: M EUR
      color: '#e01e26'
    source: Illustrative protected-area and exposure data.
    intro: Nature and exposure on the same map. Each step re-states the map -- a metric, a highlight,
      a layer -- instead of only moving the camera. Illustrative data.
    title: A data story on one map
    eyebrow: Map
    steps:
    - title: Protected areas
      metric: Designation
      text: Five sites, coloured by how they are protected. Circles are the assets around them, sized
        by exposed value.
    - title: Where pressure bites
      metric: Pressure index
      highlight: pressure >= 50
      text: The same polygons recoloured by a development-pressure index; only the sites at or above 50
        stay lit.
    - title: The flood footprint
      metric: Designation
      show: 1-in-100 flood extent
      text: 'Switch on the 1-in-100 flood extent: the layer arrives with the step and leaves with it.'
    - title: What the water reaches
      show: 1-in-100 flood extent
      highlight: flood_m >= 2
      fit: flood_m >= 2
      text: Only assets with at least 2 m of modelled flood depth stay lit, and the camera frames them.
    - title: The wetland itself
      metric: Designation
      fit: designation == 'Ramsar wetland'
      text: '`fit` frames every feature that matches a filter, so no coordinates are needed.'
- type: map
  config:
    title: Exposure as a density surface
    basemap: offline
    geojson:
    - /story-assets/stories/format-showcase/assets/showcase-exposure.geojson
    heatmap:
      weight: value_m
      radius: 40
      ramp: warm
      points: true
      label: Exposed value
    size_by:
      property: flood_m
      label: Flood depth
      unit: m
      color: '#2a7de1'
      min: 3
      max: 12
    source: Illustrative exposure points.
    text: '`heatmap` turns GeoJSON points into a density surface weighted by a property; `points: true`
      keeps the discs, and `size_by` sizes them (here by modelled flood depth). Illustrative data.'
- type: video
  config:
    title: A video, from a file or a link
    src: https://www.youtube.com/watch?v=dQw4w9WgXcQ
    caption: 'A YouTube or Vimeo link embeds the player; an mp4/webm path plays natively, and `autoplay:
      true` loops it muted like a moving photo. Illustrative link.'
    eyebrow: Video and audio
- type: audio
  config:
    title: An audio clip
    src: /story-assets/stories/format-showcase/assets/tone.wav
    text: Interviews, ambient sound, a read-aloud passage.
    caption: A two-second test tone.
- type: map-tour
  config:
    source: 'Aerial photos: Who Owns the Albanian Coast. Coordinates are approximate.'
    intro: Numbered places, each with a photo and a few words. Use the arrows (or the pins) to move the
      map from place to place.
    title: A tour of places
    eyebrow: Map tour
    places:
    - title: Narta and Zvërnec
      image: /story-assets/stories/format-showcase/assets/Narta-Zvernec.webp
      credit: Who Owns the Albanian Coast
      alt: Aerial view of the Narta lagoon, outlined in blue, ringed by pine forest with land-parcel boundaries
        marked in orange
      focus:
        center:
        - 19.4237892
        - 40.5316622
        zoom: 13
      text: Lagoon, pine forest and dunes read as one coastal system.
    - title: Vlorë port
      image: /story-assets/stories/format-showcase/assets/Puerto-de-Vlora.webp
      alt: Aerial view of Vlorë port crowded with boats and ships, with property lines traced in gold
        and red
      focus:
        center:
        - 19.4902
        - 40.4467
        zoom: 14
      text: The port, seen from above.
    - title: Vlorë airport
      image: /story-assets/stories/format-showcase/assets/Aeropuerto-de-Vlora.webp
      alt: Aerial view of a long new airport runway on flat land, with the surrounding plots outlined
      focus:
        center:
        - 19.4
        - 40.6
        zoom: 12
      text: A proposed airport beside the lagoon. Coordinates are approximate and illustrative.
- type: timeline
  config:
    intro: Dated events, in order, each with as much or as little as it needs.
    title: A sequence in time
    eyebrow: Timeline
    events:
    - title: Draft
      date: Step 1
      text: Write the argument first, in prose.
    - title: Choose formats
      date: Step 2
      text: For each claim, pick the format that shows it fastest.
    - title: Check
      date: Step 3
      tag: Review
      text: Put the numbers in a table so a reader can check them.
- type: process-board
  config:
    intro: Pick an example and follow the steps it passed through. Illustrative.
    phases:
    - title: Collect
      nodes:
      - id: a
        title: Source data
        text: Gather the inputs.
      - id: b
        title: Clean
        text: Fix what is broken.
    - title: Model
      nodes:
      - id: c
        title: Estimate
        text: Fill the gaps.
      - id: d
        title: Validate
        text: Check against a reference.
    - title: Publish
      nodes:
      - id: e
        title: Review
        text: Someone else reads it.
      - id: f
        title: Release
        text: It goes out.
    projects:
    - id: p1
      name: Case one
      path:
      - a
      - b
      - c
      - e
      - f
      note: Straight through
      with review.: null
    - id: p2
      name: Case two
      path:
      - a
      - c
      - d
      - f
      note: Skips cleaning; validated instead.
    - id: p3
      name: Case three
      path:
      - a
      - b
      - d
      - e
      note: Never released.
    title: Follow one path through a process
    eyebrow: Process board
- type: button
  config:
    text: Read the authoring guide
    href: https://github.com/
    note: A call to action -- a link styled as a button.
- type: credits
  config:
    title: About this page
    items:
    - label: Purpose
      html: A live reference for the story block catalog; all data is illustrative.
    - label: Imagery
      html: Reused from the slider story, <a href="https://whoownsthealbaniancoast.com/" target="_blank"
        rel="noopener">Who Owns the Albanian Coast</a>.
    logos:
    - src: /story-assets/stories/format-showcase/assets/logo-partner-a.svg
      alt: Partner A
      href: https://example.com/a
    - src: /story-assets/stories/format-showcase/assets/logo-partner-b.svg
      alt: Funder B
- type: scroll-chart
  config:
