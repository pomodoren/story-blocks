    eyebrow: Chart
- type: stat-cards
  config:
    title: Big numbers, one at a time
    eyebrow: Stat cards
    intro: Each `###` heading becomes a card; the number counts up while its card is on screen.
    cards:
    - title: Signature threshold
      value: 50,000
      unit: signatures
      tag: Illustrative
      text: A prefix or suffix on the value (`$4.2M`, `12.5%`) is kept while it counts.
    - title: Share of coast
      value: 12.5%
      unit: of the shoreline
      tag: Illustrative
      text: All figures on this page are made up.
- type: photo-scenes
  config:
    mode: float
    intro: A pinned full-bleed photo with one text card per scene.
    scenes:
    - title: Narta and Zvërnec
      tag: Lagoon
      image: /story-assets/stories/format-showcase/assets/Narta-Zvernec.webp
      alt: Aerial view of a lagoon ringed by pine forest
