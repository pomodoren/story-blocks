meta:
  id: deck-demo
  accent: '#2a7de1'
  collection: Reference
  label: Story as a slide deck
  theme: midnight
  title: A story that is also a talk
blocks:
- type: cover
  config:
    eyebrow: Demo · slide-deck mode
    image: /story-assets/stories/deck-demo/assets/Narta-Zvernec.webp
    image_credit: Photo reused from the slider story · Who Owns the Albanian Coast
    text: Press **Present** and this page becomes a slide deck. Every block is a slide; each section is
      a column. **All figures are illustrative.** Try `→`, `↓`, `O`, `F`, `B`, `?`.
    title: A story that is also a talk
- type: heading
  config:
    eyebrow: Sections
    level: 1
    text: Section 1 · Navigate
- type: text
  config:
    body: A `cover` or a level-1/2 heading opens a **section**. Press `→` to jump to the next one.
- type: text
  config:
    body: '`←` `→` move between sections. `↑` `↓` and Space walk every slide in order. `Home` and `End`
      jump to the ends.'
    eyebrow: Text
    title: Two kinds of movement
- type: callout
  config:
    text: The address bar tracks `#/N` while presenting, so any slide can be linked. Opening `?present`
      starts the deck straight away.
    title: Deep links
    tone: note
- type: quote
  config:
    cite: A presenter's rule
    source: Illustrative
    text: A deck is just a story you are allowed to interrupt.
- type: heading
  config:
    eyebrow: Figures
    level: 1
    text: Section 2 · Show
- type: kpi
  config:
    figures:
    - label: Block types
      text: Counted up on entry.
      value: '17'
    - label: To drive a talk
      text: Arrows, O, F, B, ?
      unit: keys
      value: '5'
    - label: Static-publishable
      text: Except live embeds.
      unit: '%'
      value: 100adasd
      title: asdasdasdsad
- type: chart
  config:
    kind: hbar
    labels:
    - Text
    - Chart
    - Table
    - Map
    - Code
    - Embed
    series:
    - data:
      - 4
      - 1
      - 1
      - 1
      - 2
      - 1
      name: Slides in this talk
    source: Illustrative data.
    text: Charts, tables and maps are authored inline, so they work in a deck without any server.
    unit: slides
- type: table
  config:
    caption: Search and sort still work while presenting.
    columns:
    - Key
    - label: Does
      num: false
    rows:
    - - O
      - Overview grid of every slide
    - - F
      - Fullscreen
    - - B
      - Blackout the screen
    - - '?'
      - Show the shortcuts
    - - Esc
      - Close, then exit
- type: map
  config:
    legend:
    - color: '#e01e26'
      label: Example marker
    markers:
    - center:
      - 19.4237892
      - 40.5316622
      text: Click a marker for its card.
      title: Narta lagoon
    source: Illustrative marker.
    text: Maps are slides too; drag and zoom them during the talk.
    title: A map is a slide too
- type: heading
  config:
    eyebrow: Code and live pages
    level: 1
    text: Section 3 · Tell
- type: code
  config:
    caption: Code is shown literally, never interpreted.
    code: |
      type: callout
      tone: note
      title: Deep links
      text: 'Any block can be a slide.'
    language: yaml
    title: A slide is a block
- type: embed
  config:
    caption: An embed frames any http(s) page or site path. It needs the network, so it is skipped in
      the static export.
    height: 65
    src: /story/format-showcase
    title: A live page inside a slide
- type: timeline
  config:
    events:
    - date: 0:00
      tag: Intro
      text: Cover slide, then press `→`.
      title: Open
    - date: 0:05
      tag: Demo
      text: Figures, chart, table, map.
      title: Show
    - date: 0:15
      tag: Wrap
      text: Code, a live page, questions.
      title: Tell
    intro: How the talk would run.
- type: credits
  config:
    items:
    - html: Illustrative demo of the story deck mode; no real data.
      label: Format
